- name: Distribution switch specifics
  hosts: clab-remote_dhcp_automation-sw-distribution-1
  gather_facts: no
  tasks:
    - name: Configure SVIs
      arista.eos.eos_l3_interfaces:
        config:
          - name: "{{ item.name }}"
            ipv4:
              - address: "{{ item.ip_address }}"
        state: merged
      loop: "{{ svi_interfaces }}"

    - name: Apply IP helper address to all SVIs
      arista.eos.eos_config:
        lines:
          - ip helper-address {{ dhcp_server }} 
        parents: interface {{ item.name }}
      loop: "{{ svi_interfaces }}"

    - name: Create and apply management interface
      arista.eos.eos_l2_interfaces:
        config:
          - name: "{{ item.name }}"
            access:
              vlan: "{{ item.vlan }}"
        state: merged
      loop: "{{ access_ports }}"

    - name: Configure trunk interfaces
      arista.eos.eos_l2_interfaces:
        config:
          - name: "{{ item.name }}"
            mode: trunk
            trunk:
              trunk_allowed_vlans: "{{ item.allowed_vlans}}"
        state: merged
      loop: "{{ trunk_ports }}"
